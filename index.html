<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-base: #0B0D0E;
    --bg-panel: #111416;
    --bg-panel-alt: #171A1D;
    --bg-surface: #1F2326;
    --text: #E8E2D4;
    --text-muted: #B8B5AC;
    --text-dim: #8B918A;
    --accent: #8FAF8F;
    --accent-warm: #BFA76A;
    --warn: #D19A66;
    --error: #C67878;
    --border: #1F2326;
    --border-strong: #2A2F33;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-base);
    color: var(--text);
    font-family: var(--mono);
    font-feature-settings: "calt" 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body { overflow-x: hidden; }
  ::selection { background: rgba(143, 175, 143, 0.3); color: var(--text); }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

  /* Reveal */
  .reveal { opacity: 0; transform: translateY(8px); transition: opacity 300ms ease-out, transform 300ms ease-out; }
  .reveal.in { opacity: 1; transform: translateY(0); }

  /* Scroll bg blur */
  .header-blur {
    backdrop-filter: blur(8px) saturate(120%);
    -webkit-backdrop-filter: blur(8px) saturate(120%);
    background: rgba(11, 13, 14, 0.72);
    border-bottom: 1px solid var(--border);
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal { transition: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="shader.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
