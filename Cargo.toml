[package]
name = "mald"
version = "0.3.0"
edition = "2021"
authors = ["NAME0x0"]
description = "Markdown Archive & Localized Daemon — terminal-first PKM with local AI"
license = "MIT"
repository = "https://github.com/NAME0x0/MALD"
keywords = ["pkm", "knowledge-management", "markdown", "ai", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "mald"
path = "src/main.rs"

[features]
default = []
gguf = ["llama_cpp_rs"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
memmap2 = "0.9"
pulldown-cmark = "0.10"
regex = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
thiserror = "1"
anyhow = "1"
chrono = "0.4"
crossterm = "0.28"
futures-util = "0.3"
indicatif = "0.17"
clap_complete = "4"
ratatui = "0.29"
libc = "0.2"
llama_cpp_rs = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
mockito = "1"
serde_json = "1"
chrono = "0.4"
