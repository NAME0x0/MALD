[package]
name = "mald"
version = "0.5.1"
edition = "2021"
authors = ["NAME0x0"]
description = "Markdown Archive & Localized Daemon — terminal-first PKM with local AI"
license = "MIT"
repository = "https://github.com/NAME0x0/MALD"
keywords = ["pkm", "knowledge-management", "markdown", "ai", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"
exclude = ["artifacts/", "dist/", ".github/", "install.ps1", "uninstall.ps1", "scoop-mald.json"]

[[bin]]
name = "mald"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:iced", "dep:iced_aw", "dep:iced_fonts", "dep:iced_anim", "dep:plotters-iced2", "dep:plotters", "dep:syntect", "dep:portable-pty", "dep:tree-sitter", "dep:tree-sitter-highlight"]
gguf = ["llama_cpp_rs"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "process", "fs", "macros"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
memmap2 = "0.9"
pulldown-cmark = "0.10"
regex = "1"
fastrand = "2.4.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
anyhow = "1"
chrono = "0.4"
crossterm = "0.28"
futures-util = "0.3"
indicatif = "0.17"
clap_complete = "4"
ratatui = "0.29"
iced = { version = "0.14", features = ["tokio", "advanced", "canvas", "markdown"], optional = true }
iced_aw = { version = "0.13.0", default-features = false, features = ["card", "badge", "menu", "tab_bar"], optional = true }
iced_fonts = { version = "0.3", features = ["bootstrap"], optional = true }
iced_anim = { version = "0.3.1", features = ["widgets"], optional = true }
plotters-iced2 = { version = "0.14", optional = true }
plotters = { version = "0.3", optional = true }
syntect = { version = "5.2", optional = true }
portable-pty = { version = "0.8", optional = true }
tree-sitter = { version = "0.24", optional = true }
tree-sitter-highlight = { version = "0.24", optional = true }
wide = "0.7"
tempfile = "3"
llama_cpp_rs = { version = "0.3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
mockito = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
