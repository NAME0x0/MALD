name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  test:
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy, audit]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libwayland-client0 \
            libwayland-cursor0 \
            libxcb1 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            xvfb
      - uses: Swatinem/rust-cache@v2
      - name: Run tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test
      - name: Run tests
        if: runner.os != 'Linux'
        run: cargo test

  build:
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mald
            friendly: mald-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mald.exe
            friendly: mald-windows-x64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: mald
            friendly: mald-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mald
            friendly: mald-macos-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} dist/${{ matrix.friendly }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.friendly }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum mald-linux-x64 mald-windows-x64.exe mald-macos-x64 mald-macos-arm64 > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes || true
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            artifacts/mald-linux-x64 \
            artifacts/mald-windows-x64.exe \
            artifacts/mald-macos-x64 \
            artifacts/mald-macos-arm64 \
            artifacts/SHA256SUMS
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.SCOOP_MALD }}
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --allow-dirty

      - name: Update Scoop manifest
        env:
          GH_TOKEN: ${{ secrets.SCOOP_PAT }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HASH=$(grep 'mald-windows-x64.exe' artifacts/SHA256SUMS | awk '{print $1}')
          cat > mald.json <<'TEMPLATE'
          {
            "version": "VERSION_PLACEHOLDER",
            "description": "Terminal-first PKM tool with local AI search. Markdown notes, semantic search, cited RAG chat.",
            "homepage": "https://github.com/NAME0x0/MALD",
            "license": "MIT",
            "architecture": {
              "64bit": {
                "url": "https://github.com/NAME0x0/MALD/releases/download/vVERSION_PLACEHOLDER/mald-windows-x64.exe",
                "hash": "HASH_PLACEHOLDER",
                "bin": [["mald-windows-x64.exe", "mald.exe"]]
              }
            },
            "checkver": "github",
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/NAME0x0/MALD/releases/download/v$version/mald-windows-x64.exe"
                }
              }
            }
          }
          TEMPLATE
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g; s/HASH_PLACEHOLDER/$HASH/g" mald.json
          # Strip leading whitespace from heredoc
          sed -i 's/^          //' mald.json
          # Push updated manifest to scoop bucket repo
          git clone https://x-access-token:${GH_TOKEN}@github.com/NAME0x0/scoop-mald.git scoop-repo
          cp mald.json scoop-repo/mald.json
          cd scoop-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mald.json
          git commit -m "Update mald to $VERSION"
          git push
